[project]
name = "bike-mapper"
version = "0.1.0"
description = "Road-cycling route planner for Dublin/Wicklow that ranks routes by expected stops, with climb seeking and GPX export"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "osmium",
    "rasterio",
    "shapely",
    "pyproj",
    "requests",
    "geopandas",
    "gpxpy",
    "fitdecode",
    "fastapi>=0.156.8",
    "uvicorn[standard]>=0.54.0",
    "mcp<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
