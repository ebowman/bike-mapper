[project]
name = "bike-mapper"
version = "0.1.0"
description = "Open-data feasibility research for a custom road-cycling route planner"
requires-python = ">=3.11"
dependencies = [
    "osmium",
    "rasterio",
    "shapely",
    "pyproj",
    "requests",
    "geopandas",
    "gpxpy",
    "fitdecode",
    "fastapi>=0.156.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
